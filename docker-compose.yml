services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env        # copy backend/.env.example to backend/.env first
    environment:
      - DATA_DIR=/app/data/matches
    volumes:
      - ./data/matches:/app/data/matches

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"             # nginx serves the UI and proxies /api and /ws to the backend
    depends_on:
      - backend
