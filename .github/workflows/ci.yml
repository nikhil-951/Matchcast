name: MatchCast AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    name: Backend tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    name: Frontend typecheck and build
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  docker:
    runs-on: ubuntu-latest
    name: Docker build
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t matchcast-backend .
